name: Agent checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check agent prompts (sections, memory sync, brain/src cross-check)
        run: node scripts/check-agents.mjs

      - name: Build site
        run: npm run build
